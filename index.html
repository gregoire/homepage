<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Nothing here, yet.</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Nothing here, yet. In the meantime, you can visit my LinkedIn profile.">
  <meta name="theme-color" content="#FAFAF9">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@500;700&display=swap"
  >

  <style>
    :root {
      --background: #FAFAF9;
      --card: #EAC849;
      --text: #FFF6D8;

      --card-radius: 8px;
      --card-padding: 42px;
      --card-padding-mobile: 30px;

      --heading-size: clamp(1.8rem, 5.6vw, 2.5rem);
      --body-size: clamp(1.05rem, 3.1vw, 1.2rem);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;

      display: grid;
      place-items: center;

      padding: clamp(16px, 4vw, 32px);

      background: var(--background);
      color: var(--text);

      font-family: "Roboto Condensed", Arial, Helvetica, sans-serif;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    .message-card {
      width: fit-content;
      max-width: min(92vw, 720px);
      padding: var(--card-padding);

      background: var(--card);
      border-radius: var(--card-radius);
      text-align: center;
    }

    .message-title {
      margin: 0 0 clamp(12px, 2.5vw, 16px);

      font-size: var(--heading-size);
      font-weight: 700;
      line-height: 1.08;
      letter-spacing: -0.02em;
    }

    .linkedin-link {
      display: inline-block;

      color: inherit;
      font-size: var(--body-size);
      font-weight: 500;
      line-height: 1.6;
      text-decoration: none;
    }

    .linkedin-link:hover,
    .linkedin-link:focus-visible {
      text-decoration: underline;
      text-decoration-thickness: 1.5px;
      text-underline-offset: 3px;
    }

    .linkedin-link:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 5px;
      border-radius: 2px;
    }

    @media (min-width: 651px) {
      .linkedin-link {
        white-space: nowrap;
      }
    }

    @media (max-width: 650px) {
      .message-card {
        width: min(92vw, 520px);
        padding: var(--card-padding-mobile);
      }

      .linkedin-link {
        text-wrap: balance;
      }
    }
  </style>
</head>

<body>
  <main class="message-card">
    <h1 class="message-title">Nothing here, yet.</h1>

    <a
      class="linkedin-link"
      href="https://www.linkedin.com/in/gregmartel"
      target="_blank"
      rel="noopener noreferrer"
    >
      In the meantime, you can visit my LinkedIn profile.
    </a>
  </main>
</body>
</html>
